<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodus</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell" id="shell" data-dock="open" data-rail="closed">

  <aside class="rail" id="rail" aria-label="Görevler">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 22V6l16 16V6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="6" cy="22" r="3.2" fill="currentColor"/><circle cx="6" cy="6" r="3.2" fill="currentColor"/><circle cx="22" cy="22" r="3.2" fill="currentColor"/><circle cx="22" cy="6" r="3.6" fill="var(--accent)"/></svg>
      <span class="brand-name">Nodus</span>
    </div>
    <button class="btn btn-ink wide" id="new-task" type="button">Yeni görev<kbd>Ctrl K</kbd></button>
    <label class="search"><span class="sr">Görevlerde ara</span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13.2 13.2 3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="session-search" type="search" placeholder="Görevlerde ara" autocomplete="off">
    </label>
    <nav class="sessions" id="session-list" aria-label="Önceki görevler"></nav>
    <div class="rail-foot">
      <div class="providers" id="provider-line"></div>
      <button class="icon-btn" id="open-settings" type="button" aria-label="Ayarlar" title="Ayarlar">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.3 2.5h3.4l.5 2.1 1.7 1 2-.8 1.7 2.9-1.6 1.5v2l1.6 1.5-1.7 2.9-2-.8-1.7 1-.5 2.1H8.3l-.5-2.1-1.7-1-2 .8-1.7-2.9 1.6-1.5v-2L2.4 7.7l1.7-2.9 2 .8 1.7-1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <header class="titleblock">
      <button class="icon-btn only-narrow" id="rail-toggle" type="button" aria-label="Görev listesini aç">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="tb-cell tb-title"><span id="task-title">Yeni görev</span></div>
      <button class="tb-cell tb-btn" id="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.5v2.5M12 2.5v2.5M8 15v2.5M12 15v2.5M2.5 8H5M2.5 12H5M15 8h2.5M15 12h2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="model-label">Otomatik</span>
        <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tb-cell tb-sandbox" id="sandbox-cell"><i class="dot"></i><span>Sandbox</span></div>
      <a class="icon-btn" href="/voice" target="_blank" rel="noopener" aria-label="Sesli mod (yeni sekmede açılır)" title="Sesli mod (yeni sekmede açılır)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10v0M6 7v6M10 3.5v13M14 6v8M17 9v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
      </a>
      <button class="icon-btn" id="dock-toggle" type="button" aria-label="Yan panel" aria-pressed="true" title="Yan panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </header>

    <div class="menu" id="model-menu" role="listbox" aria-label="Model" hidden></div>

    <section class="sheet" id="sheet" aria-label="Hesap föyü" tabindex="-1">
      <div class="sheet-inner" id="sheet-inner"></div>
    </section>

    <div class="composer-zone">
      <div id="gate-slot"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="chips" id="chips"></div>
        <textarea id="prompt" rows="1" placeholder="Görevi yaz…" aria-label="Görev"></textarea>
        <div class="composer-bar">
          <button class="icon-btn" id="attach" type="button" aria-label="Dosya ekle" title="Dosya ekle (görsel, PDF, Excel, Word, CSV)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 9.6 9.9 15.9a3.6 3.6 0 0 1-5.1-5.1l6.6-6.6a2.4 2.4 0 0 1 3.4 3.4l-6.6 6.6a1.2 1.2 0 0 1-1.7-1.7l6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="mic" type="button" aria-label="Sesli komut" title="Sesli komut" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7.5" y="2.5" width="5" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="opts">
            <button class="tgl" id="opt-verify" type="button" aria-pressed="true" title="Ağır görevlerde cevap, farklı bir sağlayıcının modeline bağımsız olarak denetletilir."><i></i>Çapraz doğrula</button>
            <button class="tgl danger" id="opt-auto" type="button" aria-pressed="false" title="Açıkken Python kodu ve kabuk komutları senden onay istemeden çalışır (seçim hatırlanır). Dosya silme ve internetten içerik okunduktan sonraki işlemler yine onay ister."><i></i>Kodu onaysız çalıştır</button>
          </div>
          <span class="grow"></span>
          <button class="send" id="send" type="submit" aria-label="Gönder" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4.5M5 9.2 10 4.2l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ico-stop" viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1.8" fill="currentColor"/></svg>
          </button>
        </div>
        <input type="file" id="file-input" multiple hidden accept=".png,.jpg,.jpeg,.csv,.txt,.md,.json,.xlsx,.pdf,.docx">
      </form>
    </div>
    <div class="drop" id="drop"><span>Dosyayı bırak</span></div>
  </main>

  <aside class="dock" id="dock" aria-label="Çıktılar ve dosyalar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-out" aria-selected="true" aria-controls="pane-out" data-tab="out">Çıktılar</button>
      <button role="tab" id="tab-files" aria-selected="false" aria-controls="pane-files" data-tab="files">Dosyalar</button>
      <button role="tab" id="tab-rules" aria-selected="false" aria-controls="pane-rules" data-tab="rules">Kurallar</button>
    </div>
    <div class="pane" id="pane-out" role="tabpanel" aria-labelledby="tab-out"></div>
    <div class="pane" id="pane-files" role="tabpanel" aria-labelledby="tab-files" hidden></div>
    <div class="pane" id="pane-rules" role="tabpanel" aria-labelledby="tab-rules" hidden></div>
  </aside>
  <div class="scrim" id="scrim"></div>
</div>
<script src="/static/dock-init.js"></script>

<dialog class="dlg" id="settings" aria-labelledby="settings-h">
  <form method="dialog" class="dlg-head"><h2 id="settings-h">Ayarlar</h2><button class="icon-btn" aria-label="Kapat">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></form>
  <div class="dlg-body" id="settings-body"></div>
</dialog>

<dialog class="dlg" id="setup" aria-labelledby="setup-h">
  <div class="dlg-head"><h2 id="setup-h">Başlamak için bir anahtar ekle</h2></div>
  <div class="dlg-body" id="setup-body"></div>
</dialog>

<dialog class="dlg" id="update" aria-labelledby="update-h">
  <div class="dlg-head"><h2 id="update-h">Yeni sürüm hazır</h2></div>
  <div class="dlg-body" id="update-body"></div>
</dialog>

<dialog class="lightbox" id="lightbox" aria-label="Görsel önizleme">
  <form method="dialog"><button class="lb-close" aria-label="Kapat">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></form>
  <img id="lightbox-img" alt="">
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="assertive"></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
