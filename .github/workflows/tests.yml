name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutuphaneleri kur
        run: python -m pip install -r requirements.txt
      - name: Testler
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Baslatici duman testi (run_nodus.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NODUS_NO_VENV=1 NODUS_NO_WINDOW=1 NODUS_PORT=8790 ./run_nodus.sh > launcher.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8790/api/ping | grep -q nodus; then echo "ping ok (${i}s)"; exit 0; fi
            sleep 1
          done
          cat launcher.log
          exit 1
